<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOMI 管理后台</title><style>body{font:16px system-ui;background:#211b3d;color:#fff3e6;margin:0}main{max-width:1000px;margin:auto;padding:40px}input,button{padding:12px;margin:6px;border-radius:6px;border:0}button{background:#ff148c;color:white;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stats article,.message{background:#342b57;padding:20px;border:1px solid #c990ff;border-radius:8px}.stats b,.stats span{display:block}.stats b{font-size:2rem}.message{margin:10px 0}.message button{float:right}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}main{padding:20px}}.trend{display:flex;align-items:end;gap:8px;min-height:180px;padding:16px 8px;overflow-x:auto;background:#342b57;border:1px solid #c990ff;border-radius:8px}.bar{min-width:42px;text-align:center;font-size:.72rem}.bar i{display:block;min-height:4px;background:#ff148c;border:1px solid #fff3e6;margin-bottom:6px}.bar span{display:block}.bar small{display:block;color:#c990ff}</style><main><section id="login"><h1>NOMI 管理后台</h1><p>仅管理员可访问</p><form id="login-form" action="#" novalidate><input type="email" placeholder="管理员邮箱" required><input type="password" placeholder="密码" required><button>登录</button><p id="login-status"></p></form></section><section id="dashboard" hidden><header><h1>数据看板</h1><button id="logout">退出</button></header><div class="stats"><article><b id="pv">0</b><span>PV</span></article><article><b id="uv">0</b><span>UV</span></article><article><b id="total">0</b><span>留言总数</span></article><article><b id="unread">0</b><span>未读</span></article></div><h2>按日访问趋势</h2><div id="trend" class="trend"></div><h2>留言管理</h2><div class="filters"><input id="search" placeholder="搜索昵称、微信号或内容"><select id="status-filter"><option value="all">全部状态</option><option value="unread">未读</option><option value="read">已读</option></select><input id="date-filter" type="date"></div><div id="messages" aria-live="polite"></div></section></main><script src="./admin.js"></script>
