<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOMI 管理后台</title><style>body{font:16px system-ui;background:#211b3d;color:#fff3e6;margin:0}main{max-width:1000px;margin:auto;padding:40px}input,button{padding:12px;margin:6px;border-radius:6px;border:0}button{background:#ff148c;color:white;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stats article,.message{background:#342b57;padding:20px;border:1px solid #c990ff;border-radius:8px}.stats b,.stats span{display:block}.stats b{font-size:2rem}.message{margin:10px 0}.message button{float:right}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}main{padding:20px}}.trend{display:flex;align-items:end;gap:8px;min-height:180px;padding:16px 8px;overflow-x:auto;background:#342b57;border:1px solid #c990ff;border-radius:8px}.bar{min-width:42px;text-align:center;font-size:.72rem}.bar i{display:block;min-height:4px;background:#ff148c;border:1px solid #fff3e6;margin-bottom:6px}.bar span{display:block}.bar small{display:block;color:#c990ff}</style><main><section id="login"><h1>NOMI 管理后台</h1><p>仅管理员可访问</p><form id="login-form" action="#" novalidate><input type="email" placeholder="管理员邮箱" required><input type="password" placeholder="密码" required><button>登录</button><p id="login-status"></p></form></section><section id="dashboard" hidden><header><h1>数据看板</h1><button id="logout">退出</button></header><div class="stats"><article><b id="pv">0</b><span>PV</span></article><article><b id="uv">0</b><span>UV</span></article><article><b id="total">0</b><span>留言总数</span></article><article><b id="unread">0</b><span>未读</span></article></div><h2>按日访问趋势</h2><div id="trend" class="trend"></div><h2>留言管理</h2><div id="messages" aria-live="polite"></div></section></main><script>const BASE='https://znyaypduzphcbnvfjcah.supabase.co';const KEY='sb_publishable_IkXxyjZy_ryvzPaByjkm1Q_NJNku05q';let token=localStorage.getItem('nomi_admin_token');const headers=()=>({'apikey':KEY,'Authorization':'Bearer '+(token||KEY),'Content-Type':'application/json'});const login=document.querySelector('#login'),dash=document.querySelector('#dashboard'),status=document.querySelector('#login-status');async function api(path,options={}){const r=await fetch(BASE+path,{...options,headers:{...headers(),...(options.headers||{})}});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||('HTTP '+r.status));return data}async function load(){if(!token){login.hidden=false;dash.hidden=true;return}try{const [msgs,views]=await Promise.all([api('/rest/v1/messages?select=*&deleted_at=is.null&order=created_at.desc'),api('/rest/v1/page_views?select=visitor_id,created_at')]);login.hidden=true;dash.hidden=false;document.querySelector('#total').textContent=msgs.length;document.querySelector('#unread').textContent=msgs.filter(m=>!m.is_read).length;document.querySelector('#pv').textContent=views.length;document.querySelector('#uv').textContent=new Set(views.map(v=>v.visitor_id)).size;const days=[];for(let i=13;i>=0;i--){const dt=new Date();dt.setHours(0,0,0,0);dt.setDate(dt.getDate()-i);days.push(dt)}const counts=days.map(d=>views.filter(v=>{const x=new Date(v.created_at);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()&&x.getDate()===d.getDate()}).length);const max=Math.max(1,...counts);document.querySelector('#trend').innerHTML=views.length?counts.map((n,i)=>'<div class="bar" title="'+days[i].toLocaleDateString()+'：'+n+' PV"><i style="height:'+Math.max(4,Math.round(n/max*130))+'px"></i><span>'+n+'</span><small>'+String(days[i].getMonth()+1).padStart(2,'0')+'/'+String(days[i].getDate()).padStart(2,'0')+'</small></div>').join(''):'<p>暂无访问数据</p>';document.querySelector('#messages').innerHTML=msgs.length?msgs.map(m=>'<article class="message"><button data-id="'+m.id+'" class="del">删除</button><button data-id="'+m.id+'" class="read">'+(m.is_read?'已读':'标记已读')+'</button><b>'+m.name+' · '+m.wechat+'</b><small> '+new Date(m.created_at).toLocaleString()+'</small><p>'+String(m.content).replaceAll('<','&lt;')+'</p></article>').join('');document.querySelectorAll('.read').forEach(b=>b.onclick=async()=>{try{await api('/rest/v1/messages?id=eq.'+b.dataset.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_read:true,read_at:new Date().toISOString()})});load()}catch(e){alert(e.message)}});document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(confirm('确定删除这条留言？'))try{await api('/rest/v1/messages?id=eq.'+b.dataset.id,{method:'DELETE'});load()}catch(e){alert(e.message)}})}catch(e){status.textContent='后台加载失败：'+e.message;token=null;localStorage.removeItem('nomi_admin_token');login.hidden=false;dash.hidden=true}}document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();status.textContent='正在登录…';const i=e.target.querySelectorAll('input');try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:i[0].value,password:i[1].value})});const data=await r.json();if(!r.ok)throw new Error(data.error_description||data.msg||'登录失败');token=data.access_token;localStorage.setItem('nomi_admin_token',token);status.textContent='';load()}catch(e){status.textContent='登录失败：'+e.message}};document.querySelector('#logout').onclick=()=>{token=null;localStorage.removeItem('nomi_admin_token');load()};load();</script>
